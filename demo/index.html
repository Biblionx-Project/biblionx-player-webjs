<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Biblionx Player Demo</title>
</head>
<body>
    <h1>Biblionx Player Demo</h1>

    <div id="wrapper"></div>
    <script src="../build/biblionx.js"></script>
    <script>
        var player = new Biblionx.Player({
            targetPath: '../build/target'
        });

        player.on('load', function () {
            // console.log('Player loaded');
        });

        player.load(document.getElementById('wrapper'));
    </script>
</body>
</html>
